# =========================================
# DueTracker - Spring Boot Configuration
# =========================================

# Server
# ================================
# Aiven MySQL Database
# ================================

spring.datasource.url=jdbc:mysql://duetracker-mysql-shivadeepduddelli.g.aivencloud.com:12973/defaultdb?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA
# ================================

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# =========================================
# H2 In-Memory Database
# =========================================



# =========================================
# JPA / Hibernate
# =========================================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false


# =========================================
# H2 Console
# =========================================


# =========================================
# Static HTML / CSS / JS
# =========================================

spring.web.resources.static-locations=classpath:/static/
razorpay.key.id=${key_value}
razorpay.key.secret=${password_value}

# =========================================
# Disable unused database auto-configurations
# =========================================

